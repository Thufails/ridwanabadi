<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <title>Kelola Artikel</title>
</head>
<body>
  <p>Membuka ruang artikel… Jika tidak berpindah, <a id="editorLink" href="admin/index.html?local=1">lanjutkan di sini</a>.</p>
  <script>
    const isLocal = ["localhost", "127.0.0.1"].includes(window.location.hostname);
    const destination = isLocal ? "admin/index.html?local=1" : "/admin/login.html";
    document.getElementById("editorLink").href = destination;
    window.location.replace(destination);
  </script>
</body>
</html>
