<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#17213b">
  <title>Login Admin Artikel | Ridwan Abadi</title>
  <link rel="stylesheet" href="login.css">
  <script defer src="login.js"></script>
</head>
<body>
  <main class="login-shell">
    <a class="login-brand" href="../index.html" aria-label="Ridwan Abadi">
      <span class="login-brand-mark">RA</span><span class="login-brand-name">RIDWAN ABADI<small>SINERGI BUSINESS SOLUTION</small></span>
    </a>
    <section class="login-card" aria-labelledby="loginTitle">
      <p class="login-eyebrow">RUANG ADMIN</p>
      <h1 id="loginTitle">Masuk ke Ruang Artikel</h1>
      <p class="login-description">Masuk untuk mengelola naskah artikel Ridwan Abadi.</p>
      <form id="loginForm" method="post" action="/api/auth/login" novalidate>
        <label for="loginEmail">Email admin</label>
        <input id="loginEmail" name="email" type="email" autocomplete="username" required maxlength="254">
        <label for="loginPassword">Kata sandi</label>
        <div class="password-field">
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" required maxlength="256">
          <button id="togglePassword" class="password-toggle" type="button" aria-label="Tampilkan kata sandi" aria-pressed="false" title="Tampilkan kata sandi">
            <svg class="eye-icon eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.7"></circle></svg>
            <svg class="eye-icon eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 6.2A10.7 10.7 0 0 1 12 6c6.1 0 9.5 6 9.5 6a16 16 0 0 1-3.1 3.7M6.2 6.3C3.8 8 2.5 12 2.5 12s3.4 6 9.5 6c1.2 0 2.3-.2 3.3-.6"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
          </button>
        </div>
        <p id="loginMessage" class="login-message" role="status" aria-live="polite"></p>
        <button id="loginButton" type="submit">Masuk</button>
      </form>
      <a class="public-link" href="../artikel.html">Kembali ke halaman artikel</a>
    </section>
    <p class="login-footnote">Akses ini khusus untuk pengelola konten.</p>
  </main>
</body>
</html>
